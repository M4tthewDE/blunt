name: Build and Release

on:
  push:
    branches: [master]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/blunt .

      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          tag: nightly-build
          name: Nightly Release
          body: "Automated build from commit ${{ github.sha }} on ${{ github.ref_name }}"
          artifacts: dist/*
          replaceArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
